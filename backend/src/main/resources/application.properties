spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
# Neon (Postgres): definir por variables de entorno, nunca en el repo
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
app.jwt.secret=${JWT_SECRET}
management.endpoints.web.exposure.include=health
app.jwt.horas=${JWT_HORAS:8}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
# Primer administrador (solo se usa si la tabla usuarios esta vacia)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
management.health.mail.enabled=false

# Datos de la inmobiliaria impresos en los PDF (definir por variables de entorno)
app.empresa.nombre=${EMPRESA_NOMBRE:Soluciones Inmobiliarias 360}
app.empresa.direccion=${EMPRESA_DIRECCION:}
app.empresa.nit=${EMPRESA_NIT:}
app.empresa.email=${EMPRESA_EMAIL:}
app.empresa.beneficiario=${EMPRESA_BENEFICIARIO:}
app.empresa.beneficiario-documento=${EMPRESA_BENEFICIARIO_DOC:}
app.empresa.cuenta-tipo=${EMPRESA_CUENTA_TIPO:}
app.empresa.cuenta-numero=${EMPRESA_CUENTA_NUMERO:}

# Correo: por defecto Mailpit local (localhost:1025, sin autenticacion). En produccion definir MAIL_*.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
app.mail.from=${MAIL_FROM:no-reply@inmobiliaria360.local}
