spring.application.name=backend
# Neon (Postgres): definir por variables de entorno, nunca en el repo
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
app.jwt.secret=${JWT_SECRET}
management.endpoints.web.exposure.include=health
app.jwt.horas=${JWT_HORAS:8}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
# Primer administrador (solo se usa si la tabla usuarios esta vacia)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
